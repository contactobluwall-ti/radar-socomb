<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Radar SOCOMB · Bluwall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003A49; --azul:#00ACC9; --petroleo:#006068; --menta:#B7DCE1; --lima:#C1D66E;
  --suave:#EEF7F8; --tinta:#0B2B33; --tinta2:#4F6870; --linea:#C9DFE3; --cafe:#8A4B00; --rojo:#A32323; --blanco:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,Arial,Helvetica,sans-serif;color:var(--tinta);background:var(--suave);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:'Space Grotesk',Manrope,Arial,sans-serif;margin:0;color:var(--navy)}
a{color:var(--petroleo)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.hide{display:none!important}
/* Encabezado */
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:'Space Grotesk',sans-serif;font-size:20px;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--menta);letter-spacing:.8px;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex:1}
nav.tabs button{background:transparent;border:0;color:#fff;padding:10px 14px;border-radius:4px;font-weight:600;opacity:.85}
nav.tabs button[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1;box-shadow:inset 0 -3px 0 var(--azul)}
.user{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--menta)}
.user button{background:transparent;border:1px solid var(--menta);color:#fff;border-radius:4px;padding:5px 10px}
main{max-width:1280px;margin:0 auto;padding:20px}
.lead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.lead h1{font-size:26px}
.lead p{margin:2px 0 0;color:var(--tinta2)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--menta);color:var(--navy)}
.pill.prueba{background:#FFE9B8;color:#5A3A00}
/* Tarjetas / KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:6px;padding:14px 16px}
.kpi .n{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--navy);line-height:1.1;margin-bottom:2px}
.kpi .t{color:var(--tinta2);font-size:12px}
.card{background:#fff;border:1px solid var(--linea);border-radius:6px;padding:16px;margin-bottom:20px}
.card h2{font-size:18px;margin-bottom:10px}
.top5{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.t5{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;font:inherit;border:1px solid var(--linea);border-left:5px solid var(--lima);border-radius:6px;padding:12px;background:#fff;cursor:pointer;text-align:left;width:100%}
.t5:hover{border-color:var(--petroleo)}
.t5 .r{font-size:11px;color:var(--tinta2);font-weight:700}
.t5 .nm{font-weight:700;color:var(--navy);margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t5 .m{font-size:12px;color:var(--tinta2)}
/* Controles */
.filtros{scroll-margin-top:72px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filtros label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--tinta2);gap:3px}
input[type=search],input[type=text],input[type=email],input[type=password],select,textarea{font:inherit;border:1px solid var(--linea);border-radius:4px;padding:7px 9px;background:#fff;color:var(--tinta);min-width:0}
.filtros select{max-width:200px}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:4px;padding:7px 12px;font-weight:600}
.btn.pri{background:var(--azul);border-color:var(--azul);color:var(--navy)}
.btn.dark{background:var(--navy);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:12px}
/* Tabla */
.tw{overflow-x:auto;border:1px solid var(--linea);border-radius:6px;background:#fff}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--linea)}
th{background:var(--navy);color:#fff;font-size:12px;white-space:nowrap;position:sticky;top:0}
tr.fila{cursor:pointer}
tr.fila:hover td{background:var(--suave)}
td .nm{font-weight:700;color:var(--navy)}
td .sub{font-size:12px;color:var(--tinta2)}
.badge{display:inline-block;min-width:26px;text-align:center;padding:2px 8px;border-radius:4px;font-weight:700;font-size:12px}
.badge.A{background:var(--lima);color:var(--navy)}
.badge.B{background:var(--menta);color:var(--navy)}
.badge.C{background:#E3E8EA;color:var(--tinta2)}
.est{padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;border:1px solid var(--linea);background:#fff}
.est.contactado{background:#E1F1F5}.est.cita{background:var(--lima)}.est.cerrada{background:var(--navy);color:#fff}.est.cancelado{background:#F6E6D2;color:var(--cafe)}
.chip{display:inline-block;background:var(--suave);border:1px solid var(--linea);border-radius:999px;padding:1px 8px;font-size:11px;margin:1px 2px 1px 0;color:var(--tinta2)}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;margin:0 4px 4px 0;line-height:1.35;white-space:nowrap;border:1px solid transparent}
.tag.ok{background:#E9F3C6;color:#33440A;border-color:#C1D66E}
.tag.falta{background:#F6E6D2;color:var(--cafe);border-color:#E6CBA8}
.tag.aviso{background:#E1F1F5;color:var(--navy);border-color:var(--menta)}
.tag a{color:inherit}
.resumen{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 10px}
.datos-c .val{display:block;font-size:12px;color:var(--tinta2);margin:0 0 4px;overflow-wrap:anywhere}
.pag{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.pag .nums{display:flex;gap:4px}
.pag button.n{min-width:32px;border:1px solid var(--linea);background:#fff;border-radius:4px;padding:5px}
.pag button.n[aria-current="page"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.vacio{padding:28px;text-align:center;color:var(--tinta2)}
/* Ficha */
.back{background:none;border:0;color:var(--petroleo);font-weight:700;padding:0;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--tinta2);font-weight:700}
.kv dd{margin:0;word-break:break-word}
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-weight:600;color:var(--navy)}
.seg button+button{border-left:1px solid var(--navy)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.nota{border-left:3px solid var(--menta);padding:4px 10px;margin:8px 0;background:var(--suave);border-radius:0 4px 4px 0}
.nota small{color:var(--tinta2)}
.warn{background:#FFF3DA;border:1px solid #E8C777;border-radius:6px;padding:10px 12px;color:#5A3A00;margin-bottom:14px}
.alerta{background:#FBE9E9;border:1px solid #E3A9A9;color:var(--rojo);padding:10px 12px;border-radius:6px;margin-bottom:12px}
/* Gráfica */
.bars{display:flex;align-items:flex-end;gap:14px;height:260px;padding:30px 8px 0;border-bottom:2px solid var(--linea)}
.bar{flex:1;max-width:90px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.bar .tot{text-align:center;font-weight:700;color:var(--navy);margin-bottom:8px}
.bar .seg1{background:var(--lima)}.bar .seg2{background:var(--menta)}.bar .seg3{background:#C9D3D6}
.blabels{display:flex;gap:14px;padding:8px}
.blabels div{flex:1;max-width:90px;text-align:center;font-size:12px;color:var(--tinta2)}
.leyenda{display:flex;gap:16px;margin-top:12px;font-size:12px;padding-bottom:4px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* Login */
.login{max-width:400px;margin:8vh auto;background:#fff;border:1px solid var(--linea);border-radius:8px;padding:28px}
.login h1{font-size:24px;margin-bottom:4px}
.login .sub{color:var(--tinta2);margin:0 0 18px}
.login label{display:block;font-size:12px;font-weight:700;color:var(--tinta2);margin:10px 0 3px}
.login input{width:100%}
.login .btn{width:100%;margin-top:16px;padding:10px}
.login .alt{margin-top:14px;font-size:13px;display:flex;justify-content:space-between}
.login .alt button{background:none;border:0;color:var(--petroleo);text-decoration:underline;padding:0}
/* Toast */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;align-items:center}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
.toast.err{background:var(--rojo)}
.toast button{background:transparent;border:1px solid #fff;color:#fff;border-radius:4px;padding:3px 8px}
footer{max-width:1280px;margin:0 auto;padding:6px 20px 30px;color:var(--tinta2);font-size:12px}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .tw{border:0;background:transparent}
  table.resp thead{display:none}
  table.resp tr{display:block;background:#fff;border:1px solid var(--linea);border-radius:6px;margin-bottom:10px;padding:6px 4px}
  table.resp td{display:flex;gap:10px;border:0;padding:4px 8px}
  table.resp td::before{content:attr(data-l);flex:0 0 92px;font-size:11px;font-weight:700;color:var(--tinta2)}
  table.resp tr.fila td:first-child{font-size:15px}
  .top-in{gap:8px}
  .kpis{grid-template-columns:1fr 1fr}
  nav.tabs{order:3;flex-basis:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ============ Configuración ============ */
const SUPABASE_URL = "https://xdszabrywjygoqenhctu.supabase.co";
const SUPABASE_KEY = "sb_publishable_cCrfKF8myxMpszlV5FDKJQ_gbw57tMe"; // clave pública; la seguridad real está en las reglas de la base
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ESTADOS = { no:"No contactado", contactado:"Contactado", cita:"Cita agendada", cancelado:"No aplicó / perdida", cerrada:"Ganada" };
const EVT = { deteccion:"Detectada por el radar", estado:"Cambio de estado", util:"Marca de utilidad", etapa:"Cambio de etapa", novedad:"Novedad", contacto:"Contactos agregados" };
const NIVELES = { 1:"Decisor identificado", 2:"Canal general", 3:"Contacto pendiente" };
const S = {
  arranque:true, user:null, rol:null, obras:[], corridas:[], cargado:false, error:null,
  vista:"semana", ficha:null, recovery:false, modoLogin:"entrar",
  tabla:{
    semana:{q:"", f:{}, orden:"puntos", pag:1, por:10},
    cambios:{q:"", f:{}, orden:"puntos", pag:1, por:10},
    historico:{q:"", f:{}, orden:"reciente", pag:1, por:10},
    mes:{q:"", f:{}, orden:"puntos", pag:1, por:10},
  },
  mes:null
};

/* ============ Utilidades ============ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seguro = u => /^https?:\/\//i.test(u||"") ? u : "";
const link = (u, t) => seguro(u) ? `<a href="${esc(seguro(u))}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>` : esc(t||u||"");
const fecha = d => { if(!d) return "—"; const x = new Date(String(d).slice(0,10)+"T12:00:00"); return isNaN(x) ? esc(d) : x.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}); };
const fechaCorta = d => { const x = new Date(String(d).slice(0,10)+"T12:00:00"); return isNaN(x) ? "" : x.toLocaleDateString("es-MX",{day:"numeric",month:"short"}); };
const ts = d => d ? new Date(d).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const nopub = v => !v || /^no (publicado|localizado|verificado|aplica)/i.test(String(v).trim());
const puede = () => S.rol === "admin" || S.rol === "editor";
const porId = id => S.obras.find(o => o.id === id);
const desglose = c => (String(c||"").match(/Desglose:\s*(.+)$/)||[])[1] || "";
const confSolo = c => String(c||"").replace(/\s*\|\s*Desglose:.*$/,"");
const etapasFam = t => String(t||"").split(/;\s*/).map(x=>x.split(":")[0].trim()).filter(Boolean).map(x=>x.charAt(0).toUpperCase()+x.slice(1)).filter((v,i,a)=>a.indexOf(v)===i);
const uniq = (arr,k) => [...new Set(arr.map(o=>o[k]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));

function toast(msg, tipo="ok", deshacer){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"+(tipo==="err"?" err":"");
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if(deshacer){ const b=document.createElement("button"); b.textContent="Deshacer"; b.onclick=()=>{el.remove();deshacer();}; el.appendChild(b); }
  box.appendChild(el);
  setTimeout(()=>el.remove(), deshacer?9000:4500);
}

/* ============ Datos ============ */
async function cargar(){
  S.error = null;
  const [o, c] = await Promise.all([
    sb.from("obras").select("*").order("puntos",{ascending:false}),
    sb.from("corridas").select("*").order("fecha",{ascending:true})
  ]);
  if(o.error || c.error){ S.error = (o.error||c.error).message; S.cargado = true; return; }
  S.obras = o.data; S.corridas = c.data; S.cargado = true;
}
async function entrarSesion(session){
  S.user = session ? session.user : null;
  if(!S.user){ S.rol=null; S.cargado=false; S.arranque=false; render(); return; }
  const m = await sb.from("miembros").select("rol").eq("email", (S.user.email||"").toLowerCase()).maybeSingle();
  S.rol = m.data ? m.data.rol : null; S.arranque = false;
  if(S.rol){ render(); await cargar(); }
  render();
}

/* ============ Acciones de escritura ============ */
async function guardarObra(id, campos, etiqueta, deshacer){
  const o = porId(id); const prev = {}; Object.keys(campos).forEach(k=>prev[k]=o[k]);
  Object.assign(o, campos); render();
  const {data, error} = await sb.from("obras").update(campos).eq("id",id).select("id");
  if(error || !data || !data.length){
    Object.assign(o, prev); render();
    toast("No se pudo guardar"+(error?": "+error.message:": tu cuenta no tiene permiso de edición."),"err"); return;
  }
  toast(etiqueta, "ok", deshacer ? ()=>guardarObra(id, prev, "Cambio deshecho") : null);
}
const cambiarEstado = (id,v) => { const o=porId(id); if(!o||o.estado===v) return; guardarObra(id,{estado:v},`${o.obra.split("(")[0].trim()}: ${ESTADOS[v]}`,true); };
const marcarUtil = (id,v) => { const o=porId(id); const nuevo = o.util===v ? null : v; guardarObra(id,{util:nuevo}, nuevo==="util"?"Marcada como útil":nuevo==="no_util"?"Marcada como no útil":"Marca quitada", true); };

async function marcarContacto(cid, ok){
  const c = S.ficha.contactos.find(x=>x.id===cid); const prev=c.dato_ok;
  c.dato_ok = (prev===ok) ? null : ok; renderFicha();
  const {data,error} = await sb.from("contactos").update({dato_ok:c.dato_ok}).eq("id",cid).select("id");
  if(error||!data.length){ c.dato_ok=prev; renderFicha(); toast("No se pudo guardar la revisión del dato","err"); }
  else toast(c.dato_ok===true?"Dato marcado como correcto":c.dato_ok===false?"Dato marcado como incorrecto":"Revisión quitada");
}
async function corregirContacto(cid){
  const inp = document.getElementById("corr-"+cid); const c = S.ficha.contactos.find(x=>x.id===cid);
  const {data,error} = await sb.from("contactos").update({corregido:inp.value.trim()||null}).eq("id",cid).select("id");
  if(error||!data.length) return toast("No se pudo guardar la corrección","err");
  c.corregido = inp.value.trim()||null; toast("Corrección guardada");
}
async function agregarNota(){
  const t = document.getElementById("nota-nueva"); const texto = t.value.trim(); if(!texto) return;
  const {error} = await sb.from("notas").insert({obra_id:S.ficha.id, texto});
  if(error) return toast("No se pudo guardar la nota: "+error.message,"err");
  t.value=""; await abrirFicha(S.ficha.id, true); toast("Nota guardada");
}

/* ============ Filtro / orden / paginación ============ */
function aplicar(rows, T){
  let r = rows.slice();
  const q = T.q.trim().toLowerCase();
  if(q) r = r.filter(o => [o.obra,o.ciudad,o.entidad,o.desarrollador,o.categoria,o.id,o.constructora].join(" ").toLowerCase().includes(q));
  for(const [k,v] of Object.entries(T.f)) if(v) r = r.filter(o => String(o[k]) === v);
  const ord = {
    puntos:(a,b)=>b.puntos-a.puntos || a.nivel_contacto-b.nivel_contacto,
    reciente:(a,b)=>String(b.primera_deteccion).localeCompare(a.primera_deteccion) || b.puntos-a.puntos,
    nombre:(a,b)=>a.obra.localeCompare(b.obra,"es")
  }[T.orden];
  return r.sort(ord);
}
function paginas(total, actual){
  if(total<=7) return Array.from({length:total},(_,i)=>i+1);
  const s = new Set([1,total,actual,actual-1,actual+1]); const a=[...s].filter(n=>n>=1&&n<=total).sort((x,y)=>x-y);
  const out=[]; a.forEach((n,i)=>{ if(i&&n-a[i-1]>1) out.push("…"); out.push(n); }); return out;
}
function tablaHTML(clave, base, {mostrarNov=false}={}){
  const T = S.tabla[clave], rows = aplicar(base, T);
  const total = Math.max(1, Math.ceil(rows.length/T.por)); if(T.pag>total) T.pag=total;
  const ini = (T.pag-1)*T.por, vis = rows.slice(ini, ini+T.por);
  const sel = (k,lbl,vals,fmt=x=>x) => `<label>${lbl}<select data-f="${clave}|${k}"><option value="">Todos</option>${vals.map(v=>`<option value="${esc(v)}"${T.f[k]===String(v)?" selected":""}>${esc(fmt(v))}</option>`).join("")}</select></label>`;
  const hay = Object.values(T.f).some(Boolean) || T.q;
  return `
  <div class="filtros" data-tabla="${clave}">
    <label>Buscar<input type="search" placeholder="Obra, ciudad, desarrollador…" value="${esc(T.q)}" data-q="${clave}" style="min-width:220px"></label>
    ${sel("categoria","Categoría",uniq(base,"categoria"))}
    ${sel("entidad","Entidad",uniq(base,"entidad"))}
    ${sel("clase","Clase",["A","B","C"])}
    ${sel("estado","Estado",Object.keys(ESTADOS),k=>ESTADOS[k])}
    ${sel("nivel_contacto","Contacto",[1,2,3],k=>NIVELES[k])}
    <label>Ordenar<select data-o="${clave}"><option value="puntos"${T.orden==="puntos"?" selected":""}>Más puntos</option><option value="reciente"${T.orden==="reciente"?" selected":""}>Más reciente</option><option value="nombre"${T.orden==="nombre"?" selected":""}>Nombre</option></select></label>
    ${hay?`<button class="btn sm" data-limpiar="${clave}">Limpiar filtros</button>`:""}
    ${clave==="historico"||clave==="mes"?`<button class="btn sm" data-csv="${clave}">Descargar CSV</button>`:""}
  </div>
  <div class="tw"><table class="resp">
    <thead><tr><th>Obra</th><th>Clase</th><th>Puntos</th><th>Categoría</th><th>Ciudad</th><th>Etapa</th><th>Contacto</th><th>Estado</th></tr></thead>
    <tbody>${vis.length ? vis.map(o=>`
      <tr class="fila" data-ficha="${esc(o.id)}">
        <td data-l="Obra"><div class="nm">${esc(o.obra)}</div><div class="sub">${esc(o.id)} · ${esc(o.desarrollador||"")}${mostrarNov&&o.novedad&&o.novedad!=="sin cambio"?` · <b>${esc(o.novedad)}</b>`:""}</div></td>

const mesDe = o => String(o.primera_deteccion||"").slice(0,7);
const etiquetaMes = m => { const d=new Date(m+"-15T12:00:00"); return isNaN(d)?m:d.toLocaleDateString("es-MX",{month:"long",year:"numeric"}); };
function vistaMes(){
  const meses = [...new Set(S.obras.map(mesDe).filter(Boolean))].sort().reverse();
  if(!S.mes || !meses.includes(S.mes)) S.mes = meses[0] || null;
  const delMes = S.obras.filter(o=>mesDe(o)===S.mes);
  const cs = S.corridas.slice(-8);
  const max = Math.max(1,...cs.map(c=>c.nuevas||0));
  const por = (k)=>delMes.filter(o=>o.estado===k).length;
  const total = delMes.length, A = delMes.filter(o=>o.clase==="A");
  const utiles = delMes.filter(o=>o.util==="util").length, noU = delMes.filter(o=>o.util==="no_util").length;
  const cat = {}; delMes.forEach(o=>{ const k=String(o.categoria||"").split(" / ")[0]; cat[k]=(cat[k]||0)+1; });
  const cats = Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  return `<div class="lead"><div><h1>Mes e histórico de corridas</h1><p>Evolución semana a semana y todas las obras detectadas en el mes.</p></div>

  <section class="card"><h2>Obras nuevas por corrida</h2>
    ${cs.length?`<div class="bars">${cs.map(c=>{const h=n=>Math.round((n||0)/max*180);return `<div class="bar"><div class="tot">${c.nuevas||0}</div>
      <div class="seg1" style="height:${h(c.clase_a)}px" title="Clase A: ${c.clase_a||0}"></div><div class="seg2" style="height:${h(c.clase_b)}px" title="Clase B: ${c.clase_b||0}"></div><div class="seg3" style="height:${h(c.clase_c)}px" title="Clase C: ${c.clase_c||0}"></div></div>`}).join("")}</div>
      <div class="blabels">${cs.map(c=>`<div>${esc(fechaCorta(c.fecha))}${c.es_prueba?"<br>(prueba)":""}</div>`).join("")}</div>
      <div class="leyenda"><span><i style="background:var(--lima)"></i>Clase A</span><span><i style="background:var(--menta)"></i>Clase B</span><span><i style="background:#C9D3D6"></i>Clase C</span></div>
      ${cs.length<2?`<p class="sub" style="color:var(--tinta2)">Hay una sola corrida registrada; la comparación aparece cuando haya más semanas.</p>`:""}`
    :`<div class="vacio">Aún no hay corridas registradas.</div>`}
  </section>
  <div class="grid2">
    <section class="card"><h2>Avance comercial del mes</h2>
      <dl class="kv">${Object.entries(ESTADOS).map(([k,v])=>`<dt>${v}</dt><dd><b>${por(k)}</b> de ${total}</dd>`).join("")}</dl></section>
    <section class="card"><h2>Calidad del radar en el mes</h2>
      <dl class="kv"><dt>Marcadas útiles</dt><dd><b>${utiles}</b></dd><dt>Marcadas no útiles</dt><dd><b>${noU}</b></dd>
      <dt>Obras A</dt><dd><b>${A.length}</b> (${A.filter(o=>o.util==="util").length} útiles, ${A.filter(o=>o.estado==="cita"||o.estado==="cerrada").length} con cita o ganadas)</dd>

  </div>

  <section class="card"><h2>Todas las obras de ${S.mes?esc(etiquetaMes(S.mes)):"el mes"} (${delMes.length})</h2>
    ${tablaHTML("mes",delMes,{mostrarNov:true})}</section>`;
}

/* ============ Ficha ============ */
async function abrirFicha(id, silencioso){
  const o = porId(id); if(!o) return;
  if(!silencioso){ S.ficha = {id, contactos:[], notas:[], eventos:[], cargando:true}; render(); window.scrollTo(0,0); }
  const [c,n,e] = await Promise.all([
    sb.from("contactos").select("*").eq("obra_id",id).order("id"),
    sb.from("notas").select("*").eq("obra_id",id).order("creado_en",{ascending:false}),
    sb.from("eventos").select("*").eq("obra_id",id).order("creado_en",{ascending:false}).limit(30)
  ]);
  if(!S.ficha || S.ficha.id!==id) return;
  S.ficha = {id, contactos:c.data||[], notas:n.data||[], eventos:e.data||[], cargando:false};
  renderFicha();
}
const limpia = v => String(v ?? "").replace(/\s+/g," ").trim();
const tag = (t,k) => `<span class="tag ${k}">${t}</span>`;
function etiquetasContacto(c){
  const t=[], v=[];
  if(c.linkedin_url && !c.linkedin_es_busqueda) t.push(tag(`LinkedIn conseguido · ${link(c.linkedin_url,"ver perfil")}`,"ok"));
  else if(c.linkedin_url) t.push(tag(`Sin perfil · ${link(c.linkedin_url,"buscar en LinkedIn")}`,"falta"));
  else t.push(tag("Sin LinkedIn","falta"));
  if(!nopub(c.telefono)) v.push(`Tel. ${esc(limpia(c.telefono))}`); else t.push(tag("Sin teléfono","falta"));
  if(!nopub(c.correo)) v.push(esc(limpia(c.correo))); else t.push(tag("Sin correo","falta"));
  if(/vigencia por verificar/i.test(c.fuente||"")) t.push(tag("Vigencia por verificar","aviso"));
  return v.map(x=>`<span class="val">${x}</span>`).join("")+t.join("");
}
function resumenContactos(o, cs){
  const t=[], reales=cs.filter(c=>c.linkedin_url && !c.linkedin_es_busqueda).length;
  t.push(!nopub(o.linkedin_empresa)?tag("LinkedIn de la empresa conseguido","ok"):tag("Sin LinkedIn de la empresa","falta"));
  t.push(reales?tag(`LinkedIn de decisor conseguido (${reales})`,"ok"):tag("Sin LinkedIn de decisor","falta"));
  t.push(!cs.length?tag("Sin decisor identificado","falta"):tag(`${cs.length} persona${cs.length>1?"s":""} de contacto`,"ok"));
  t.push(!nopub(o.telefono_empresa)?tag("Teléfono de la empresa","ok"):tag("Sin teléfono","falta"));
  t.push(!nopub(o.correo_empresa)?tag("Correo de la empresa","ok"):tag("Sin correo","falta"));
  if(!cs.length && nopub(o.telefono_empresa) && nopub(o.correo_empresa) && nopub(o.sitio_web)) t.unshift(tag("Sin contacto","falta"));
  return `<div class="resumen">${t.join("")}</div>`;
}

  if(S.arranque){ app.innerHTML = `<div class="vacio">Cargando…</div>`; return; }
  if(S.recovery || !S.user){ app.innerHTML = pantallaLogin(); return; }
  if(!S.rol){ app.innerHTML = pantallaSinAcceso(); return; }
  const tab = (k,t)=>`<button data-vista="${k}" ${S.vista===k||(S.vista==="ficha"&&k===S.ultimaVista)?'aria-current="page"':""}>${t}</button>`;
  app.innerHTML = `<header class="top"><div class="top-in">
      <div class="brand"><b>Radar SOCOMB</b><span>Construye Inteligente</span></div>
      <nav class="tabs" aria-label="Secciones">${tab("semana","Esta semana")}${tab("mes","Mes")}${tab("historico","Histórico")}</nav>
      <div class="user"><span>${esc(S.user.email)} · ${esc(S.rol)}</span><button data-salir>Salir</button></div></div></header>
    <main id="contenido">${!S.cargado?`<div class="vacio">Cargando obras…</div>`:S.error?`<div class="alerta">No se pudieron cargar los datos: ${esc(S.error)}</div>`:
      S.vista==="ficha"?(S.ficha?vistaFicha():`<div class="vacio">Abriendo ficha…</div>`):S.vista==="mes"?vistaMes():S.vista==="historico"?vistaHistorico():vistaSemana()}</main>
    <footer>Uso interno · SOCOMB no garantiza obligaciones del contratista ni administra su dinero.</footer>`;
}

/* ============ Navegación ============ */
function irA(v){
  if(v==="ficha") return;
  S.vista = v; S.ultimaVista = v; S.ficha = null;
  if(location.hash !== "#"+v) history.pushState(null,"","#"+v);
  render(); window.scrollTo(0,0);
}
function desdeHash(){
  const h = location.hash.slice(1);
  if(h.startsWith("obra-")){ S.ultimaVista = S.ultimaVista||"semana"; S.vista="ficha"; if(S.cargado&&porId(h.slice(5))) abrirFicha(h.slice(5)); else render(); }
  else { S.vista = ["semana","mes","historico"].includes(h)?h:"semana"; S.ultimaVista=S.vista; S.ficha=null; render(); }
}
window.addEventListener("popstate", desdeHash);

/* ============ Eventos (delegación) ============ */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-vista],[data-ficha],[data-pag],[data-limpiar],[data-csv],[data-util],[data-dato],[data-corr],[data-nota],[data-salir],[data-modo]");
  if(!t) return;
  if(e.target.closest("[data-stop]") && t.dataset.ficha) return; // clic en el selector de estado no abre la ficha
  if(t.dataset.vista) return irA(t.dataset.vista);
  if(t.dataset.ficha){ history.pushState(null,"","#obra-"+t.dataset.ficha); S.vista="ficha"; return abrirFicha(t.dataset.ficha); }
  if(t.dataset.pag){ const [k,n]=t.dataset.pag.split("|"); S.tabla[k].pag=+n; render(); const ft=document.querySelector(`[data-tabla="${k}"]`); if(ft) ft.scrollIntoView(); return; }
  if(t.dataset.limpiar){ const T=S.tabla[t.dataset.limpiar]; T.q=""; T.f={}; T.pag=1; return render(); }
  if(t.dataset.csv) return descargarCSV(t.dataset.csv);
  if(t.dataset.util){ const [id,v]=t.dataset.util.split("|"); return marcarUtil(id,v); }
  if(t.dataset.dato){ const [id,v]=t.dataset.dato.split("|"); return marcarContacto(+id, v==="true"); }
  if(t.dataset.corr) return corregirContacto(+t.dataset.corr);
  if("nota" in t.dataset) return agregarNota();
  if("salir" in t.dataset){ return sb.auth.signOut(); }
  if(t.dataset.modo){ S.modoLogin=t.dataset.modo; return render(); }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if("mes" in t.dataset && t.tagName==="SELECT"){ S.mes=t.value; S.tabla.mes.pag=1; S.tabla.mes.q=""; S.tabla.mes.f={}; return render(); }
  if(t.dataset.estado) return cambiarEstado(t.dataset.estado, t.value);
  if(t.dataset.f){ const [k,c]=t.dataset.f.split("|"); S.tabla[k].f[c]=t.value; S.tabla[k].pag=1; return render(); }
  if(t.dataset.o){ S.tabla[t.dataset.o].orden=t.value; return render(); }
  if(t.dataset.por){ S.tabla[t.dataset.por].por=+t.value; S.tabla[t.dataset.por].pag=1; return render(); }
});
let tq; document.addEventListener("input", e=>{
  const t=e.target; if(!t.dataset.q) return;
  clearTimeout(tq); tq=setTimeout(()=>{ const T=S.tabla[t.dataset.q]; T.q=t.value; T.pag=1; const pos=t.selectionStart; render(); const n=document.querySelector(`[data-q="${t.dataset.q}"]`); if(n){n.focus(); n.setSelectionRange(pos,pos);} },250);
});
document.addEventListener("submit", async e=>{
  if(e.target.id!=="form-login") return; e.preventDefault();
  const msg = document.getElementById("msg-login"); const ok=(t)=>msg.innerHTML=`<div class="warn">${esc(t)}</div>`, mal=(t)=>msg.innerHTML=`<div class="alerta">${esc(t)}</div>`;
  const email = (document.getElementById("em")||{}).value?.trim(); const pw = (document.getElementById("pw")||{}).value;
  const url = location.origin+location.pathname;
  try{
    if(S.recovery){ if(!pw||pw.length<8) return mal("La contraseña debe tener al menos 8 caracteres."); const {error}=await sb.auth.updateUser({password:pw}); if(error) return mal(error.message); S.recovery=false; ok("Contraseña actualizada."); const {data}=await sb.auth.getSession(); return entrarSesion(data.session); }
    if(!email) return mal("Escribe tu correo.");
    if(S.modoLogin==="olvide"){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:url}); return error?mal(error.message):ok("Si el correo existe, recibirás un enlace para crear una nueva contraseña."); }
    if(!pw||pw.length<8) return mal("La contraseña debe tener al menos 8 caracteres.");
    if(S.modoLogin==="crear"){ const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:url}}); if(error) return mal(error.message); return data.session?null:ok("Revisa tu correo y confirma tu cuenta; después entra con tu contraseña."); }
    const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) mal(error.message==="Invalid login credentials"?"Correo o contraseña incorrectos.":error.message);
  }catch(err){ mal("No se pudo conectar. Revisa tu internet e inténtalo de nuevo."); }
});

function descargarCSV(clave){
  const rows = aplicar(clave==="mes"?S.obras.filter(o=>mesDe(o)===S.mes):S.obras, S.tabla[clave]);
  const cols = ["id","obra","categoria","entidad","ciudad","etapa","clase","puntos","desarrollador","constructora","nivel_contacto","estado","util","novedad","primera_deteccion","fuente_url"];
  const cel = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const csv = "﻿"+[cols.join(","), ...rows.map(o=>cols.map(c=>cel(o[c])).join(","))].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `radar-socomb-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ============ Arranque ============ */
sb.auth.onAuthStateChange((evento, session)=>{
  if(evento==="PASSWORD_RECOVERY"){ S.recovery=true; render(); return; }
  if(evento==="INITIAL_SESSION"||evento==="SIGNED_IN"||evento==="SIGNED_OUT"){ setTimeout(async()=>{ await entrarSesion(session); if(S.rol) desdeHash(); },0); }
});
render();
</script>
</body>
</html>
